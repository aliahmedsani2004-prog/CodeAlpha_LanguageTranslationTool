
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Language Translation Tool</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #fff;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            resize: vertical;
        }

        textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .row {
            display: flex;
            gap: 15px;
            margin: 15px 0;
        }

        .col { flex: 1; }

        label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }

        .btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            color: #fff;
            background: #667eea;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background: #5a67d8; }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            background: #f4f6ff;
            border-left: 5px solid #667eea;
            border-radius: 10px;
        }

        .result-box h3 { margin: 0 0 10px; color: #333; }

        #result {
            font-size: 18px;
            color: #222;
            margin: 0 0 12px;
        }

        .copy-btn {
            padding: 8px 16px;
            font-size: 14px;
            color: #fff;
            background: #38a169;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .copy-btn:hover { background: #2f855a; }

        #msg { margin-left: 8px; color: #38a169; font-size: 14px; }

        @media (max-width: 500px) {
            .row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌐 Language Translator</h1>

        <form method="POST">
            {% csrf_token %}

            <textarea name="text" dir="auto" placeholder="Yahan text likho...">{{ text }}</textarea>

            <div class="row">
                <div class="col">
                    <label>From</label>
                    <select name="source">
                        <option value="auto" {% if source == "auto" %}selected{% endif %}>Auto-detect</option>
                        {% for lang in languages %}
                            <option value="{{ lang }}" {% if lang == source %}selected{% endif %}>{{ lang|title }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col">
                    <label>To</label>
                    <select name="target">
                        {% for lang in languages %}
                            <option value="{{ lang }}" {% if lang == target %}selected{% endif %}>{{ lang|title }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <button type="submit" class="btn">Translate</button>
        </form>

        {% if translated %}
            <div class="result-box">
                <h3>Translation</h3>
                <p id="result" dir="auto">{{ translated }}</p>
                <button type="button" class="copy-btn" onclick="copyText()">Copy</button>
                <span id="msg"></span>
            </div>

            <script>
                function copyText() {
                    const text = document.getElementById("result").innerText;
                    navigator.clipboard.writeText(text).then(function () {
                        document.getElementById("msg").innerText = "Copied!";
                    });
                }
            </script>
        {% endif %}
    </div>
</body>
</html>
